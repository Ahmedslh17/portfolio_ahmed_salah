service: portfolio_ahmed_salah

image: kreatixstudio/portfolio_ahmed_salah

servers:
  web:
    - 72.62.24.8

proxy:
  ssl: true
  host: portfolio.mes2vis.com

registry:
  server: hub.docker.com
  username: kreatixstudio
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - GMAIL_USERNAME
    - GMAIL_APP_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "portfolio_ahmed_salah_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  remote: root@72.62.24.8